<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Record Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap');
:root {
  --bg:#0a0e1a; --surface:#111827; --surface2:#1a2236; --surface3:#0f172a;
  --border:#1e2d45; --accent:#00d4ff; --text:#e2e8f0; --text2:#94a3b8; --text3:#475569;
  --kpi:#00d4ff; --nonkpi:#ff6b35; --other:#a78bfa; --meeting:#34d399; --onsite:#fbbf24; --email:#f472b6;
  --done:#22c55e; --pending:#f59e0b; --active:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px 16px;}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.header h1{font-family:'Space Mono',monospace;font-size:16px;color:var(--accent);}
.header p{font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;margin-top:2px;}
.live{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3);font-family:'Space Mono',monospace;}
.dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Filter bar */
.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.filter-label{font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;white-space:nowrap;}
.filter-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.filter-input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Sarabun',sans-serif;font-size:12px;padding:6px 10px;outline:none;cursor:pointer;}
.filter-input:focus{border-color:var(--accent);}
.filter-input::-webkit-calendar-picker-indicator{filter:invert(0.6);}
.preset-group{display:flex;gap:4px;margin-left:auto;}
.preset-btn{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text3);font-size:10px;font-family:'Space Mono',monospace;cursor:pointer;transition:all .2s;}
.preset-btn:hover{border-color:var(--accent);color:var(--accent);}
.preset-btn.active{background:var(--surface2);border-color:var(--accent);color:var(--accent);}
.apply-btn{padding:6px 14px;border:none;border-radius:6px;background:var(--accent);color:#000;font-size:11px;font-family:'Space Mono',monospace;cursor:pointer;font-weight:700;transition:opacity .2s;}
.apply-btn:hover{opacity:.85;}

/* Summary cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.card:nth-child(1)::before{background:var(--accent);}
.card:nth-child(2)::before{background:#ff6b35;}
.card:nth-child(3)::before{background:#a78bfa;}
.card:nth-child(4)::before{background:#22c55e;}
.clabel{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-family:'Space Mono',monospace;margin-bottom:6px;}
.cval{font-size:22px;font-weight:700;font-family:'Space Mono',monospace;}
.card:nth-child(1) .cval{color:var(--accent);}
.card:nth-child(2) .cval{color:#ff6b35;}
.card:nth-child(3) .cval{color:#a78bfa;}
.card:nth-child(4) .cval{color:#22c55e;}
.csub{font-size:10px;color:var(--text3);margin-top:3px;}

/* Chart sections */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;}
.chart-box.full{grid-column:1/-1;}
.chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.chart-title{font-size:12px;font-weight:600;font-family:'Space Mono',monospace;}
.chart-sub{font-size:10px;color:var(--text3);margin-top:2px;}
.toggle{display:flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:3px;}
.tbtn{padding:4px 9px;border:none;border-radius:4px;font-size:10px;font-family:'Space Mono',monospace;cursor:pointer;background:transparent;color:var(--text3);transition:all .2s;}
.tbtn.active{background:var(--surface2);color:var(--accent);border:1px solid var(--border);}

/* Horizontal bar chart */
.hbar-chart{display:flex;flex-direction:column;gap:8px;}
.hbar-row{display:flex;align-items:center;gap:8px;}
.hbar-label{width:80px;font-size:11px;color:var(--text2);text-align:right;flex-shrink:0;font-family:'Space Mono',monospace;}
.hbar-track{flex:1;height:30px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.hbar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;width:0;transition:width .8s cubic-bezier(.16,1,.3,1);}
.hbar-fill span{font-size:10px;font-family:'Space Mono',monospace;color:rgba(255,255,255,.9);font-weight:700;white-space:nowrap;}
.hbar-val{width:60px;font-size:11px;color:var(--text2);font-family:'Space Mono',monospace;text-align:right;flex-shrink:0;}

/* Stacked bar */
.stacked{height:46px;border-radius:6px;overflow:hidden;display:flex;width:100%;margin-top:4px;}
.seg{height:100%;display:flex;align-items:center;justify-content:center;width:0;transition:width .8s cubic-bezier(.16,1,.3,1);overflow:hidden;}
.seg span{font-size:10px;font-family:'Space Mono',monospace;color:rgba(255,255,255,.9);font-weight:700;white-space:nowrap;}

/* Status chart (donut-like bars) */
.status-chart{display:flex;flex-direction:column;gap:10px;}
.status-row{display:flex;align-items:center;gap:8px;}
.status-label{width:70px;font-size:11px;color:var(--text2);text-align:right;flex-shrink:0;}
.status-track{flex:1;height:26px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.status-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;width:0;transition:width .8s cubic-bezier(.16,1,.3,1);}
.status-fill span{font-size:10px;font-family:'Space Mono',monospace;color:rgba(255,255,255,.9);font-weight:700;}
.status-val{width:30px;font-size:11px;color:var(--text2);font-family:'Space Mono',monospace;text-align:right;flex-shrink:0;}

/* Vertical bar chart (daily) */
.vbar-wrap{overflow-x:auto;padding-bottom:4px;}
.vbar-chart{display:flex;align-items:flex-end;gap:4px;min-height:160px;padding:0 4px;}
.vbar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
.vbar-stack{display:flex;flex-direction:column-reverse;align-items:center;width:100%;border-radius:3px 3px 0 0;overflow:hidden;cursor:pointer;transition:opacity .2s;}
.vbar-stack:hover{opacity:.8;}
.vbar-seg{width:100%;transition:height .8s cubic-bezier(.16,1,.3,1);}
.vbar-label{font-size:9px;color:var(--text3);font-family:'Space Mono',monospace;white-space:nowrap;transform:rotate(-45deg);transform-origin:top right;margin-top:4px;}
.vbar-total{font-size:9px;color:var(--text3);font-family:'Space Mono',monospace;margin-bottom:2px;}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.lh{font-family:'Space Mono',monospace;color:var(--text3);font-size:10px;}

/* Tooltip */
.tooltip{position:fixed;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--text);pointer-events:none;z-index:100;display:none;max-width:200px;}

/* Loading/Error */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:12px;}
.spin{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.lp{font-size:12px;color:var(--text3);font-family:'Space Mono',monospace;}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:14px;color:#fca5a5;font-size:12px;text-align:center;}

/* Footer */
.footer{text-align:center;font-size:10px;color:var(--text3);font-family:'Space Mono',monospace;padding-top:14px;border-top:1px solid var(--border);margin-top:4px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fin{animation:fadeUp .35s ease forwards;}

@media(max-width:640px){
  .cards{grid-template-columns:repeat(2,1fr);}
  .chart-grid{grid-template-columns:1fr;}
  .chart-box.full{grid-column:1;}
  .hbar-label{width:60px;font-size:10px;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div><h1>JOB_RECORD</h1><p>Daily Work Dashboard</p></div>
    <div class="live"><div class="dot"></div><span id="upd">loading...</span></div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <span class="filter-label">FROM</span>
    <input type="date" class="filter-input" id="dateFrom">
    <span class="filter-label">TO</span>
    <input type="date" class="filter-input" id="dateTo">
    <button class="apply-btn" onclick="applyFilter()">APPLY</button>
    <div class="preset-group">
      <button class="preset-btn" onclick="setPreset('today')">TODAY</button>
      <button class="preset-btn" onclick="setPreset('week')">WEEK</button>
      <button class="preset-btn" onclick="setPreset('month')">MONTH</button>
      <button class="preset-btn active" onclick="setPreset('all')">ALL</button>
    </div>
  </div>

  <div id="app">
    <div class="loading"><div class="spin"></div><p class="lp">กำลังโหลดข้อมูล...</p></div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
const SHEET_ID = '1oou_Sj2ZdwnAaqEMXGCUtw2syPAQ24qP8JrTfINdojc';
const TYPE_COLORS = {'KPI':'#00d4ff','Non-KPI':'#ff6b35','Other':'#a78bfa','Meeting':'#34d399','Onsite':'#fbbf24','Check E-mail':'#f472b6'};
const STATUS_COLORS = {'เสร็จสิ้น':'#22c55e','คงค้าง':'#f59e0b','กำลังทำ':'#3b82f6'};
function gc(t){return TYPE_COLORS[t]||'#64748b';}
function gsc(s){return STATUS_COLORS[s]||'#64748b';}

let allData=[], filteredData=[], typeMode='bar', dailyMode='type';

function parseDuration(val){
  if(!val||val==='') return 0;
  val=String(val).trim();
  if(val.includes(':')){
    const p=val.split(':');
    return (parseFloat(p[0])||0)*60+(parseFloat(p[1])||0)+(parseFloat(p[2])||0)/60;
  }
  const n=parseFloat(val);
  if(!isNaN(n)) return n<2?n*24*60:n;
  return 0;
}

function parseDate(val){
  if(!val) return null;
  val=String(val).trim();
  // M/D/YYYY or YYYY-MM-DD
  if(val.includes('/')){
    const p=val.split('/');
    if(p.length===3){
      const m=parseInt(p[0]),d=parseInt(p[1]),y=parseInt(p[2]);
      return new Date(y,m-1,d);
    }
  }
  const d=new Date(val);
  return isNaN(d)?null:d;
}

function fmtH(m){
  const h=Math.floor(m/60),min=Math.round(m%60);
  if(h===0)return`${min}m`;
  if(min===0)return`${h}h`;
  return`${h}h ${min}m`;
}

function fmtDate(d){
  if(!d)return'';
  return`${d.getDate()}/${d.getMonth()+1}`;
}

function toYMD(d){
  if(!d)return'';
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function loadData(){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=job_record`;
  const res=await fetch(url);
  const text=await res.text();
  const json=JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  const cols=json.table.cols.map(c=>c.label);
  return (json.table.rows||[]).map(row=>{
    const obj={};
    cols.forEach((c,i)=>{const cell=row.c[i];obj[c]=cell?(cell.f!=null?cell.f:cell.v):null;});
    obj._date=parseDate(obj['Job_Date']);
    obj._dur=parseDuration(obj['Duration']);
    return obj;
  });
}

function setPreset(p){
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  if(p==='today'){
    document.getElementById('dateFrom').value=toYMD(new Date(y,m,d));
    document.getElementById('dateTo').value=toYMD(new Date(y,m,d));
  } else if(p==='week'){
    const day=now.getDay(), diff=day===0?6:day-1;
    document.getElementById('dateFrom').value=toYMD(new Date(y,m,d-diff));
    document.getElementById('dateTo').value=toYMD(new Date(y,m,d));
  } else if(p==='month'){
    document.getElementById('dateFrom').value=toYMD(new Date(y,m,1));
    document.getElementById('dateTo').value=toYMD(new Date(y,m,d));
  } else {
    document.getElementById('dateFrom').value='';
    document.getElementById('dateTo').value='';
  }
  applyFilter();
}

function applyFilter(){
  const from=document.getElementById('dateFrom').value;
  const to=document.getElementById('dateTo').value;
  filteredData=allData.filter(r=>{
    if(!r._date) return false;
    const rd=toYMD(r._date);
    if(from && rd<from) return false;
    if(to && rd>to) return false;
    return true;
  });
  renderCharts();
}

function renderCharts(){
  const done=filteredData.filter(r=>r['Status']==='เสร็จสิ้น'||r['Status']==='คงค้าง');

  // Summary
  const totalMin=done.reduce((s,r)=>s+r._dur,0);
  const doneCount=filteredData.filter(r=>r['Status']==='เสร็จสิ้น').length;
  const pendCount=filteredData.filter(r=>r['Status']==='คงค้าง').length;

  // Type map
  const typeMap={};
  done.forEach(r=>{
    const t=r['Job_Type']||'Other';
    if(!typeMap[t])typeMap[t]=0;
    typeMap[t]+=r._dur;
  });
  const types=Object.entries(typeMap).sort((a,b)=>b[1]-a[1]);
  const totalTypeMin=types.reduce((s,[,m])=>s+m,0);

  // Status map
  const statusMap={};
  filteredData.forEach(r=>{
    const s=r['Status']||'?';
    if(!statusMap[s])statusMap[s]=0;
    statusMap[s]++;
  });
  const statuses=Object.entries(statusMap).sort((a,b)=>b[1]-a[1]);
  const totalStatus=filteredData.length;

  // Daily map
  const dailyMap={};
  done.forEach(r=>{
    if(!r._date)return;
    const dk=toYMD(r._date);
    if(!dailyMap[dk])dailyMap[dk]={total:0,types:{},names:{}};
    dailyMap[dk].total+=r._dur;
    const t=r['Job_Type']||'Other';
    if(!dailyMap[dk].types[t])dailyMap[dk].types[t]=0;
    dailyMap[dk].types[t]+=r._dur;
    const n=r['Job_Name']||'?';
    if(!dailyMap[dk].names[n])dailyMap[dk].names[n]=0;
    dailyMap[dk].names[n]+=r._dur;
  });
  const dailyKeys=Object.keys(dailyMap).sort();
  const maxDaily=Math.max(...dailyKeys.map(k=>dailyMap[k].total),1);

  document.getElementById('app').innerHTML=`
    <div class="cards fin">
      <div class="card"><div class="clabel">Total Jobs</div><div class="cval">${filteredData.length}</div><div class="csub">ทุกสถานะ</div></div>
      <div class="card"><div class="clabel">Total Hours</div><div class="cval">${fmtH(totalMin)}</div><div class="csub">เวลาทำงานรวม</div></div>
      <div class="card"><div class="clabel">Job Types</div><div class="cval">${types.length}</div><div class="csub">ประเภทงาน</div></div>
      <div class="card"><div class="clabel">Completed</div><div class="cval">${doneCount}</div><div class="csub">เสร็จสิ้น / คงค้าง ${pendCount}</div></div>
    </div>

    <div class="chart-grid fin">
      <!-- Chart 1: Duration by Type -->
      <div class="chart-box">
        <div class="chart-header">
          <div><div class="chart-title">Duration by Job Type</div><div class="chart-sub">เวลารวมตามประเภทงาน</div></div>
          <div class="toggle">
            <button class="tbtn ${typeMode==='bar'?'active':''}" onclick="swType('bar')">BAR</button>
            <button class="tbtn ${typeMode==='stacked'?'active':''}" onclick="swType('stacked')">100%</button>
          </div>
        </div>
        <div id="type-chart-area">
          ${typeMode==='bar'?renderTypeBar(types,totalTypeMin):renderTypeStacked(types,totalTypeMin)}
        </div>
        <div class="legend">${types.map(([t,m])=>`<div class="li"><div class="ld" style="background:${gc(t)}"></div><span>${t}</span><span class="lh">${fmtH(m)}</span></div>`).join('')}</div>
      </div>

      <!-- Chart 2: Status -->
      <div class="chart-box">
        <div class="chart-header">
          <div><div class="chart-title">Jobs by Status</div><div class="chart-sub">จำนวนงานแต่ละสถานะ</div></div>
        </div>
        <div class="status-chart">
          ${statuses.map(([s,c])=>{
            const pct=Math.round(c/totalStatus*100);
            return`<div class="status-row">
              <div class="status-label">${s}</div>
              <div class="status-track"><div class="status-fill" data-w="${pct}%" style="background:${gsc(s)}"><span>${pct}%</span></div></div>
              <div class="status-val">${c}</div>
            </div>`;
          }).join('')}
        </div>
        <div class="legend">${statuses.map(([s,c])=>`<div class="li"><div class="ld" style="background:${gsc(s)}"></div><span>${s}</span><span class="lh">${c} งาน</span></div>`).join('')}</div>
      </div>
    </div>

    <!-- Chart 3: Daily vertical bar -->
    <div class="chart-box full fin">
      <div class="chart-header">
        <div><div class="chart-title">Daily Duration</div><div class="chart-sub">เวลาทำงานรายวัน</div></div>
        <div class="toggle">
          <button class="tbtn ${dailyMode==='type'?'active':''}" onclick="swDaily('type')">JOB TYPE</button>
          <button class="tbtn ${dailyMode==='name'?'active':''}" onclick="swDaily('name')">JOB NAME</button>
        </div>
      </div>
      <div class="vbar-wrap">
        <div class="vbar-chart" id="daily-chart-area">
          ${renderDaily(dailyKeys,dailyMap,maxDaily)}
        </div>
      </div>
      <div class="legend" id="daily-legend">
        ${renderDailyLegend(dailyKeys,dailyMap)}
      </div>
    </div>

    <div class="footer">อัปเดตจาก Google Sheets • ${new Date().toLocaleString('th-TH')}</div>
  `;

  document.getElementById('upd').textContent=`live ✓`;

  setTimeout(()=>{
    document.querySelectorAll('.hbar-fill,.seg,.status-fill').forEach(el=>{el.style.width=el.dataset.w;});
    document.querySelectorAll('.vbar-seg').forEach(el=>{el.style.height=el.dataset.h;});
  },60);
}

function renderTypeBar(types,totalMin){
  const mx=types[0]?.[1]||1;
  return`<div class="hbar-chart">${types.map(([t,m])=>{
    const pct=Math.round(m/mx*100),tp=totalMin>0?Math.round(m/totalMin*100):0;
    return`<div class="hbar-row">
      <div class="hbar-label">${t}</div>
      <div class="hbar-track"><div class="hbar-fill" data-w="${pct}%" style="background:${gc(t)}"><span>${tp}%</span></div></div>
      <div class="hbar-val">${fmtH(m)}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderTypeStacked(types,totalMin){
  if(!totalMin) return '<div style="color:#475569;text-align:center;padding:20px">ไม่มีข้อมูล</div>';
  return`<div class="stacked">${types.map(([t,m])=>{
    const pct=m/totalMin*100;
    return`<div class="seg" data-w="${pct.toFixed(1)}%" style="background:${gc(t)}" title="${t}: ${fmtH(m)}">${pct>=8?`<span>${pct.toFixed(0)}%</span>`:''}</div>`;
  }).join('')}</div>`;
}

function renderDaily(keys,map,maxMin){
  if(!keys.length) return '<div style="color:#475569;padding:20px;font-size:12px">ไม่มีข้อมูล</div>';
  const barW=Math.max(28,Math.min(56,Math.floor(700/keys.length)-6));
  const maxH=140;

  return keys.map(dk=>{
    const day=map[dk];
    const totalH=maxMin>0?Math.round(day.total/maxMin*maxH):0;
    const groups=dailyMode==='type'?day.types:day.names;
    const entries=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
    const totalSeg=entries.reduce((s,[,v])=>s+v,0)||1;

    const segs=entries.map(([k,v])=>{
      const segH=Math.round(v/totalSeg*totalH);
      const col=dailyMode==='type'?gc(k):`hsl(${Math.abs(k.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%360},60%,55%)`;
      return`<div class="vbar-seg" data-h="${segH}px" style="height:0;background:${col};width:${barW}px;" title="${k}: ${fmtH(v)}"></div>`;
    }).join('');

    const d=new Date(dk+'T00:00:00');
    const label=`${d.getDate()}/${d.getMonth()+1}`;

    return`<div class="vbar-col" style="width:${barW}px">
      <div class="vbar-total">${fmtH(day.total)}</div>
      <div class="vbar-stack" style="width:${barW}px;height:${totalH}px" 
           onmouseenter="showTip(event,'${dk}',${JSON.stringify(entries).replace(/'/g,"'")})"
           onmouseleave="hideTip()">
        ${segs}
      </div>
      <div class="vbar-label">${label}</div>
    </div>`;
  }).join('');
}

function renderDailyLegend(keys,map){
  if(dailyMode==='type'){
    const typeSet=new Set();
    keys.forEach(k=>Object.keys(map[k].types).forEach(t=>typeSet.add(t)));
    return[...typeSet].map(t=>`<div class="li"><div class="ld" style="background:${gc(t)}"></div><span>${t}</span></div>`).join('');
  } else {
    const nameSet=new Set();
    keys.forEach(k=>Object.keys(map[k].names).forEach(n=>nameSet.add(n)));
    return[...nameSet].map(n=>{
      const col=`hsl(${Math.abs(n.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%360},60%,55%)`;
      return`<div class="li"><div class="ld" style="background:${col}"></div><span>${n}</span></div>`;
    }).join('');
  }
}

function showTip(e,dk,entries){
  const tip=document.getElementById('tooltip');
  const lines=entries.map(([k,v])=>`<div>${k}: <b>${fmtH(v)}</b></div>`).join('');
  tip.innerHTML=`<div style="font-family:'Space Mono',monospace;font-size:10px;color:#94a3b8;margin-bottom:4px">${dk}</div>${lines}`;
  tip.style.display='block';
  tip.style.left=(e.clientX+10)+'px';
  tip.style.top=(e.clientY-10)+'px';
}
function hideTip(){document.getElementById('tooltip').style.display='none';}

function swType(m){
  typeMode=m;
  if(!filteredData.length)return;
  const done=filteredData.filter(r=>r['Status']==='เสร็จสิ้น'||r['Status']==='คงค้าง');
  const typeMap={};
  done.forEach(r=>{const t=r['Job_Type']||'Other';if(!typeMap[t])typeMap[t]=0;typeMap[t]+=r._dur;});
  const types=Object.entries(typeMap).sort((a,b)=>b[1]-a[1]);
  const total=types.reduce((s,[,m])=>s+m,0);
  document.getElementById('type-chart-area').innerHTML=m==='bar'?renderTypeBar(types,total):renderTypeStacked(types,total);
  document.querySelectorAll('.tbtn').forEach(b=>{
    if(b.getAttribute('onclick')===`swType('${m}')`)b.classList.add('active');
    else if(b.getAttribute('onclick')?.startsWith('swType'))b.classList.remove('active');
  });
  setTimeout(()=>{ document.querySelectorAll('.hbar-fill,.seg').forEach(el=>el.style.width=el.dataset.w); },60);
}

function swDaily(m){
  dailyMode=m;
  const done=filteredData.filter(r=>r['Status']==='เสร็จสิ้น'||r['Status']==='คงค้าง');
  const dailyMap={};
  done.forEach(r=>{
    if(!r._date)return;
    const dk=toYMD(r._date);
    if(!dailyMap[dk])dailyMap[dk]={total:0,types:{},names:{}};
    dailyMap[dk].total+=r._dur;
    const t=r['Job_Type']||'Other';
    if(!dailyMap[dk].types[t])dailyMap[dk].types[t]=0;
    dailyMap[dk].types[t]+=r._dur;
    const n=r['Job_Name']||'?';
    if(!dailyMap[dk].names[n])dailyMap[dk].names[n]=0;
    dailyMap[dk].names[n]+=r._dur;
  });
  const dailyKeys=Object.keys(dailyMap).sort();
  const maxDaily=Math.max(...dailyKeys.map(k=>dailyMap[k].total),1);
  document.getElementById('daily-chart-area').innerHTML=renderDaily(dailyKeys,dailyMap,maxDaily);
  document.getElementById('daily-legend').innerHTML=renderDailyLegend(dailyKeys,dailyMap);
  document.querySelectorAll('.tbtn').forEach(b=>{
    if(b.getAttribute('onclick')===`swDaily('${m}')`)b.classList.add('active');
    else if(b.getAttribute('onclick')?.startsWith('swDaily'))b.classList.remove('active');
  });
  setTimeout(()=>{ document.querySelectorAll('.vbar-seg').forEach(el=>el.style.height=el.dataset.h); },60);
}

(async()=>{
  try{
    allData=await loadData();
    filteredData=[...allData];
    renderCharts();
  } catch(e){
    document.getElementById('app').innerHTML=`<div class="err">❌ โหลดข้อมูลไม่ได้<br><small>${e.message}</small></div>`;
    document.getElementById('upd').textContent='error';
  }
})();
</script>
</body>
