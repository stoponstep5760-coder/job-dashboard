<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Record Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #7c3aed;
    --kpi: #00d4ff;
    --nonkpi: #ff6b35;
    --other: #a78bfa;
    --meeting: #34d399;
    --onsite: #fbbf24;
    --email: #f472b6;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #475569;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .header-left h1 {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .header-left p {
    font-size: 12px;
    color: var(--text3);
    margin-top: 2px;
    font-family: 'Space Mono', monospace;
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text3);
    font-family: 'Space Mono', monospace;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Loading */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
    gap: 16px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p {
    color: var(--text3);
    font-size: 13px;
    font-family: 'Space Mono', monospace;
  }

  /* Error */
  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px;
    padding: 16px;
    color: #fca5a5;
    font-size: 13px;
    text-align: center;
  }

  /* Summary cards */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .summary-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .summary-card.total::before { background: var(--accent); }
  .summary-card.hours::before { background: var(--accent2); }
  .summary-card.types::before { background: var(--other); }

  .summary-card:hover { border-color: rgba(0,212,255,0.3); }

  .card-label {
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'Space Mono', monospace;
    margin-bottom: 8px;
  }

  .card-value {
    font-size: 28px;
    font-weight: 700;
    font-family: 'Space Mono', monospace;
    line-height: 1;
  }

  .summary-card.total .card-value { color: var(--accent); }
  .summary-card.hours .card-value { color: var(--accent2); }
  .summary-card.types .card-value { color: var(--other); }

  .card-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
  }

  /* Chart section */
  .chart-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .chart-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    font-family: 'Space Mono', monospace;
  }

  .chart-subtitle {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
  }

  /* Toggle buttons */
  .toggle-group {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
  }

  .toggle-btn {
    padding: 5px 12px;
    border: none;
    border-radius: 5px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    cursor: pointer;
    background: transparent;
    color: var(--text3);
    transition: all 0.2s;
  }

  .toggle-btn.active {
    background: var(--surface2);
    color: var(--accent);
    border: 1px solid var(--border);
  }

  /* Bar Chart */
  .bar-chart {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bar-label {
    width: 80px;
    font-size: 12px;
    color: var(--text2);
    text-align: right;
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
  }

  .bar-track {
    flex: 1;
    height: 36px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
    padding-left: 10px;
    min-width: 40px;
  }

  .bar-fill span {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    color: rgba(255,255,255,0.9);
    font-weight: 700;
    white-space: nowrap;
  }

  .bar-value {
    width: 70px;
    font-size: 12px;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
    text-align: right;
    flex-shrink: 0;
  }

  /* Stacked bar */
  .stacked-bar-container {
    margin-top: 8px;
  }

  .stacked-bar {
    height: 52px;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    width: 100%;
  }

  .stacked-segment {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
    position: relative;
  }

  .stacked-segment span {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    color: rgba(255,255,255,0.9);
    font-weight: 700;
    white-space: nowrap;
  }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .legend-hours {
    font-family: 'Space Mono', monospace;
    color: var(--text3);
    font-size: 11px;
  }

  /* Colors per type */
  .color-kpi { background: var(--kpi); }
  .color-nonkpi { background: var(--nonkpi); }
  .color-other { background: var(--other); }
  .color-meeting { background: var(--meeting); }
  .color-onsite { background: var(--onsite); }
  .color-email { background: var(--email); }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--text3);
    font-family: 'Space Mono', monospace;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  /* Animate in */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-in {
    animation: fadeUp 0.4s ease forwards;
  }

  .animate-in:nth-child(2) { animation-delay: 0.05s; }
  .animate-in:nth-child(3) { animation-delay: 0.1s; }

  /* Responsive */
  @media (max-width: 480px) {
    .summary-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .card-value { font-size: 22px; }
    .bar-label { width: 60px; font-size: 10px; }
    .bar-value { width: 55px; font-size: 10px; }
    .toggle-btn { padding: 4px 8px; font-size: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <h1>JOB_RECORD</h1>
      <p>Duration by Job Type</p>
    </div>
    <div class="status-dot">
      <div class="dot"></div>
      <span id="last-update">loading...</span>
    </div>
  </div>

  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <p>กำลังโหลดข้อมูล...</p>
    </div>
  </div>
</div>

<script>
const SHEET_ID = '1oou_Sj2ZdwnAaqEMXGCUtw2syPAQ24qP8JrTfINdojc';
const SHEET_NAME = 'job_record';

const TYPE_COLORS = {
  'KPI':          '#00d4ff',
  'Non-KPI':      '#ff6b35',
  'Other':        '#a78bfa',
  'Meeting':      '#34d399',
  'Onsite':       '#fbbf24',
  'Check E-mail': '#f472b6',
};

function getColor(type) {
  return TYPE_COLORS[type] || '#64748b';
}

// Parse duration string "H:MM:SS" or decimal hours to minutes
function parseDuration(val) {
  if (!val || val === '') return 0;
  val = String(val).trim();
  // Format H:MM:SS or HH:MM:SS
  if (val.includes(':')) {
    const parts = val.split(':');
    const h = parseFloat(parts[0]) || 0;
    const m = parseFloat(parts[1]) || 0;
    const s = parseFloat(parts[2]) || 0;
    return h * 60 + m + s / 60;
  }
  // Decimal (fraction of day from Sheets)
  const num = parseFloat(val);
  if (!isNaN(num)) {
    if (num < 2) return num * 24 * 60; // fraction of day
    return num; // already minutes?
  }
  return 0;
}

function fmtHours(minutes) {
  const h = Math.floor(minutes / 60);
  const m = Math.round(minutes % 60);
  if (h === 0) return `${m}m`;
  if (m === 0) return `${h}h`;
  return `${h}h ${m}m`;
}

async function fetchData() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  
  const cols = json.table.cols.map(c => c.label);
  const rows = json.table.rows || [];
  
  return rows.map(row => {
    const obj = {};
    cols.forEach((col, i) => {
      const cell = row.c[i];
      obj[col] = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : cell.v) : null;
    });
    return obj;
  });
}

let chartMode = 'bar'; // 'bar' or 'stacked'
let chartData = null;

function renderApp(data) {
  // Filter only completed/pending (has End_Time)
  const done = data.filter(r => r['Status'] === 'เสร็จสิ้น' || r['Status'] === 'คงค้าง');

  // Group by Job_Type → sum duration in minutes
  const typeMap = {};
  done.forEach(r => {
    const type = r['Job_Type'] || 'Other';
    const dur = parseDuration(r['Duration']);
    if (!typeMap[type]) typeMap[type] = 0;
    typeMap[type] += dur;
  });

  // Sort by duration desc
  const types = Object.entries(typeMap).sort((a, b) => b[1] - a[1]);
  const totalMin = types.reduce((s, [, m]) => s + m, 0);
  const totalJobs = done.length;
  const uniqueTypes = types.length;

  chartData = { types, totalMin, totalJobs, uniqueTypes };

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="summary-grid">
      <div class="summary-card total animate-in">
        <div class="card-label">Total Jobs</div>
        <div class="card-value">${totalJobs}</div>
        <div class="card-sub">รายการที่เสร็จแล้ว</div>
      </div>
      <div class="summary-card hours animate-in">
        <div class="card-label">Total Hours</div>
        <div class="card-value">${fmtHours(totalMin)}</div>
        <div class="card-sub">เวลารวมทั้งหมด</div>
      </div>
      <div class="summary-card types animate-in">
        <div class="card-label">Job Types</div>
        <div class="card-value">${uniqueTypes}</div>
        <div class="card-sub">ประเภทงาน</div>
      </div>
    </div>

    <div class="chart-section">
      <div class="chart-header">
        <div>
          <div class="chart-title">Duration by Job Type</div>
          <div class="chart-subtitle">เวลารวมแยกตามประเภทงาน</div>
        </div>
        <div class="toggle-group">
          <button class="toggle-btn ${chartMode === 'bar' ? 'active' : ''}" onclick="switchMode('bar')">BAR</button>
          <button class="toggle-btn ${chartMode === 'stacked' ? 'active' : ''}" onclick="switchMode('stacked')">100%</button>
        </div>
      </div>

      <div id="chart-area">
        ${chartMode === 'bar' ? renderBar(types, totalMin) : renderStacked(types, totalMin)}
      </div>

      <div class="divider"></div>

      <div class="legend">
        ${types.map(([type, min]) => `
          <div class="legend-item">
            <div class="legend-dot" style="background:${getColor(type)}"></div>
            <span>${type}</span>
            <span class="legend-hours">${fmtHours(min)}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="footer">
      อัปเดตจาก Google Sheets • ${new Date().toLocaleString('th-TH')}
    </div>
  `;

  document.getElementById('last-update').textContent = 'live';

  // Animate bars after render
  setTimeout(() => {
    document.querySelectorAll('.bar-fill').forEach(el => {
      const w = el.dataset.width;
      el.style.width = w;
    });
    document.querySelectorAll('.stacked-segment').forEach(el => {
      const w = el.dataset.width;
      el.style.width = w;
    });
  }, 50);
}

function renderBar(types, totalMin) {
  const maxMin = types[0]?.[1] || 1;
  return `
    <div class="bar-chart">
      ${types.map(([type, min]) => {
        const pct = Math.round((min / maxMin) * 100);
        const totalPct = totalMin > 0 ? Math.round((min / totalMin) * 100) : 0;
        return `
          <div class="bar-row">
            <div class="bar-label">${type}</div>
            <div class="bar-track">
              <div class="bar-fill" 
                   data-width="${pct}%" 
                   style="width:0%; background:${getColor(type)}">
                <span>${totalPct}%</span>
              </div>
            </div>
            <div class="bar-value">${fmtHours(min)}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderStacked(types, totalMin) {
  if (totalMin === 0) return '<div style="color:var(--text3);text-align:center;padding:20px;">ไม่มีข้อมูล</div>';
  return `
    <div class="stacked-bar-container">
      <div class="stacked-bar">
        ${types.map(([type, min]) => {
          const pct = (min / totalMin) * 100;
          return `
            <div class="stacked-segment"
                 data-width="${pct.toFixed(1)}%"
                 style="width:0%; background:${getColor(type)}"
                 title="${type}: ${fmtHours(min)} (${pct.toFixed(1)}%)">
              ${pct >= 8 ? `<span>${pct.toFixed(0)}%</span>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function switchMode(mode) {
  chartMode = mode;
  if (!chartData) return;
  const { types, totalMin } = chartData;
  document.getElementById('chart-area').innerHTML = 
    mode === 'bar' ? renderBar(types, totalMin) : renderStacked(types, totalMin);
  
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.toLowerCase().includes(mode === 'bar' ? 'bar' : '100'));
  });

  setTimeout(() => {
    document.querySelectorAll('.bar-fill, .stacked-segment').forEach(el => {
      el.style.width = el.dataset.width;
    });
  }, 50);
}

// Init
(async () => {
  try {
    const data = await fetchData();
    renderApp(data);
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="error">
        ❌ โหลดข้อมูลไม่ได้<br>
        <small>กรุณาตรวจสอบว่า Google Sheet เปิด Public แล้ว</small><br>
        <small style="color:#64748b">${e.message}</small>
      </div>
    `;
    document.getElementById('last-update').textContent = 'error';
  }
})();
</script>
</body>
</html>
